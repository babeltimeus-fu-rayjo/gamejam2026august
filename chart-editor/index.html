<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Chart Editor — 4K Rhythm</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="group">
      <button id="btnLoad" title="Load an audio file (mp3/ogg/wav)">Load Audio</button>
      <input id="fileAudio" type="file" accept="audio/*,.mp3,.ogg,.wav" hidden />
      <button id="btnImport" title="Import an existing chart.json">Import</button>
      <input id="fileChart" type="file" accept=".json,application/json" hidden />
      <button id="btnExport" title="Export chart.json (Ctrl+S)">Export</button>
    </div>
    <div class="group">
      <button id="btnPlay" title="Play/Pause (Space)">▶</button>
      <span id="timeDisplay" class="mono">0:00.000</span>
      <select id="rateSelect" title="Playback rate (+/-)">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
      </select>
      <label class="chk"><input type="checkbox" id="chkMetronome" /> Metro <span class="key">M</span></label>
      <label class="chk"><input type="checkbox" id="chkHitsounds" /> Hits <span class="key">H</span></label>
    </div>
    <div class="group">
      <label>BPM <input id="inpBpm" type="number" min="1" max="400" step="0.1" value="120" /></label>
      <button id="btnTap" title="Tap tempo (T) — tap along on the beat">Tap</button>
      <button id="btnHalf" title="Halve BPM">÷2</button>
      <button id="btnDouble" title="Double BPM">×2</button>
      <label>Offset <input id="inpOffset" type="number" step="0.001" value="0" /> s</label>
      <button id="btnOffMinus" title="Offset −10 ms">−10ms</button>
      <button id="btnOffPlus" title="Offset +10 ms">+10ms</button>
      <label>Snap
        <select id="snapSelect" title="Grid snap ([ / ])">
          <option value="1">1/1</option>
          <option value="2">1/2</option>
          <option value="3">1/3</option>
          <option value="4" selected>1/4</option>
          <option value="6">1/6</option>
          <option value="8">1/8</option>
          <option value="12">1/12</option>
          <option value="16">1/16</option>
        </select>
      </label>
    </div>
    <div class="group">
      <button id="btnAnalyze" disabled title="Detect BPM, offset and onsets">Analyze</button>
      <label title="Onset detection sensitivity (lower = more onsets)">Sens
        <input id="inpSens" type="range" min="1.2" max="2.5" step="0.05" value="1.5" />
      </label>
      <span id="bpmCandidates"></span>
      <button id="btnGenerate" disabled title="Generate notes from detected onsets (undoable)">Generate</button>
    </div>
    <div class="group">
      <label>Title <input id="inpTitle" type="text" size="18" /></label>
      <label>Artist <input id="inpArtist" type="text" size="12" /></label>
    </div>
  </div>

  <div id="dropHint">Drop an audio file here, or click <b>Load Audio</b></div>
  <canvas id="waveCanvas"></canvas>
  <canvas id="laneCanvas" tabindex="0"></canvas>

  <div id="statusbar">
    <span id="statusCursor" class="mono"></span>
    <span id="statusNotes"></span>
    <span id="statusInfo"></span>
    <span class="hints">click: tap · drag: hold · drag edge: resize · rclick: delete · shift-drag: select · DFJK: place at playhead · ctrl+wheel: zoom</span>
  </div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
